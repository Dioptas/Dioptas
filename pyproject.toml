[project]
name = "dioptas"
dynamic = ["version"]
description = "GUI program for reduction and exploration of 2D X-ray diffraction data"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Clemens Prescher", email = "clemens.prescher@gmail.com" }]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "EXtra-data>=1.13.0,<2.0; sys_platform == \"linux\"",
    "h5py>=3.13.0,<4.0",
    "hdf5plugin>=5.0.0,<6.0",
    "lmfit>=1.3.3,<2.0",
    "pandas>=2.1.1,<3.0",
    "psutil>=5.9.5,<6.0",
    "PyCifRW>=5.0.0,<6.0",
    "PyQt6>=6.8,<7.0",
    "pyfai>=2025.12.1",
    "pyqtgraph>=0.13.7,<0.14",
    "pyshortcuts>=1.8.1,<2.0",
    "QtPy>=2.4.3,<3.0",
    "scikit-image>=0.26.0,<0.27",
    "sharedmem>=0.3.8,<0.4",
    "watchdog>=6.0.0,<7.0",
    "pyopengl>=3.1.7,<4.0",
    "pyopengl-accelerate>=3.1.7,<4.0",
    "xypattern>=1.2.2,<2.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.16.3,<2.0",
    "numexpr>=2.10.2,<3.0",
    "qt-material>=2.14,<3.0",
    "bitshuffle>=0.5.1",
    "xraydb>=4.5.8",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0,<10.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-qt>=4.4.0,<5.0",
    "mock>=5.1.0,<6.0",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
dioptas = "dioptas:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
dioptas = ["resources/**"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dioptas*"]
exclude = ["dioptas.tests*"]

[build-system]
requires = ["setuptools>=68", "setuptools_scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "dioptas/_version.py"
fallback_version = "0.8.5"

[tool.coverage.run]
source = ["dioptas"]
omit = [
    "dioptas/tests/*",
    "dioptas/resources/*",
    "dioptas/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

