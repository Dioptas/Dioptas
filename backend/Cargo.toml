
[package]
name = "dioptas-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Python-free Dioptas desktop processing boundary"

[features]
default = ["dioptrin"]
# Dioptrin is the default engine; retain the diagnostic non-numerical build.
dioptrin = []

[dependencies]
dioptas-contract = { path = "../contract" }
dioptrin-io = { git = "https://github.com/CPrescher/dioptrin-io", tag = "v0.3.0", features = ["wrappers", "hdf5", "containers", "bruker", "oxford", "raxis", "fixed", "fit2d", "kcd", "mpa", "esperanto", "mar345", "xsd"] }
dioptrin = { git = "https://github.com/CPrescher/Dioptrin", rev = "71cb46634cfdb2f7884cc2693bf602a328792fa6", default-features = false }
half = "2"
serde = { version = "1", features = ["derive", "rc"] }
# Preserve the established ordering of plugin controls in embedded schemas.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
phasesmith-core = { git = "https://github.com/CPrescher/PhaseSmith", rev = "e47507f4adf32ea2a137ddf6b735db88f8a67537" }
phasesmith-crystallography = { git = "https://github.com/CPrescher/PhaseSmith", rev = "e47507f4adf32ea2a137ddf6b735db88f8a67537" }
phasesmith-io = { git = "https://github.com/CPrescher/PhaseSmith", rev = "e47507f4adf32ea2a137ddf6b735db88f8a67537" }
phasesmith-model = { git = "https://github.com/CPrescher/PhaseSmith", rev = "e47507f4adf32ea2a137ddf6b735db88f8a67537" }
phasesmith-single-crystal = { git = "https://github.com/CPrescher/PhaseSmith", rev = "e47507f4adf32ea2a137ddf6b735db88f8a67537", default-features = false, features = ["spots", "solution"] }
phasesmith-persistence = { git = "https://github.com/CPrescher/PhaseSmith", rev = "e47507f4adf32ea2a137ddf6b735db88f8a67537" }
phasesmith-workflows = { git = "https://github.com/CPrescher/PhaseSmith", rev = "e47507f4adf32ea2a137ddf6b735db88f8a67537", features = ["single-crystal"] }
peritheos = { git = "https://github.com/CPrescher/peritheos", rev = "3c79b1aedf28c348a49cc22d9f24d92895546283" }
nalgebra = "0.35"
tiff = "0.8"
base64 = "0.22"
png = "0.18"
roxmltree = "0.21"
csv = "1"
hdf5 = { package = "hdf5-metno", version = "=0.15.1", features = ["static", "zlib", "lzf"] }
blake3 = { version = "1", features = ["rayon"] }
rayon = "1"
rmp-serde = "1"
xraydb = { version = "=0.4.1", default-features = false }

# Retain runtime-dispatched ARM SHA instructions for existing project blob
# identities; live display buffers use an independent parallel fingerprint.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bin]]
name = "dioptas-processor"
path = "src/main.rs"

[dev-dependencies]
hdf5-sys = { package = "hdf5-metno-sys", version = "=0.12.5" }
flate2 = "1"
