<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Modernized Dioptas D icon</title>
  <desc id="desc">A bold geometric D with a warm off-white-to-orange gradient on a graphite squircle.</desc>

  <defs>
    <linearGradient id="surface" x1="72" y1="64" x2="440" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31363b"/>
      <stop offset="1" stop-color="#232629"/>
    </linearGradient>
    <linearGradient id="rim" x1="74" y1="58" x2="438" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="0.72" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="mark" x1="152" y1="126" x2="348" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe0b2"/>
      <stop offset="0.2" stop-color="#ffcf7a"/>
      <stop offset="0.5" stop-color="#ffad33"/>
      <stop offset="0.6" stop-color="#ff9500"/>
      <stop offset="1" stop-color="#ff9500"/>
    </linearGradient>
  </defs>

  <path d="M 156 20
           H 356
           C 438 20 492 74 492 156
           V 356
           C 492 438 438 492 356 492
           H 156
           C 74 492 20 438 20 356
           V 156
           C 20 74 74 20 156 20
           Z"
        fill="url(#surface)"/>

  <!-- A restrained specular rim keeps the dark icon distinct in the macOS Dock. -->
  <path d="M 156 22
           H 356
           C 436 22 490 76 490 156
           V 356
           C 490 436 436 490 356 490
           H 156
           C 76 490 22 436 22 356
           V 156
           C 22 76 76 22 156 22
           Z"
        fill="none" stroke="url(#rim)" stroke-width="4"/>

  <!-- The complete letter assembly is optically offset slightly to the right. -->
  <g transform="translate(14 0)">
  <!-- A broad ambient layer gives depth without relying on unsupported SVG blur filters. -->
  <path fill="#0d0f10" stroke="#0d0f10" stroke-width="14" stroke-linejoin="round"
        fill-rule="evenodd" opacity="0.13" transform="translate(6 10)" d="
    M 142 126
    H 244
    C 320 126 370 174 370 256
    C 370 338 320 386 244 386
    H 142
    Z

    M 202 190
    V 322
    H 244
    C 286 322 308 300 308 256
    C 308 212 286 190 244 190
    Z
  "/>

  <!-- A restrained contact layer keeps the letter visually anchored. -->
  <path fill="#111315" fill-rule="evenodd" opacity="0.27" transform="translate(3 4)" d="
    M 142 126
    H 244
    C 320 126 370 174 370 256
    C 370 338 320 386 244 386
    H 142
    Z

    M 202 190
    V 322
    H 244
    C 286 322 308 300 308 256
    C 308 212 286 190 244 190
    Z
  "/>

  <!-- The stem and open counter preserve the old icon's familiar silhouette. -->
  <path fill="url(#mark)" fill-rule="evenodd" d="
    M 142 126
    H 244
    C 320 126 370 174 370 256
    C 370 338 320 386 244 386
    H 142
    Z

    M 202 190
    V 322
    H 244
    C 286 322 308 300 308 256
    C 308 212 286 190 244 190
    Z
  "/>
  </g>
</svg>
