<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Insert a blank map cell: an empty cell (dashed, as it holds no point)
       with a plus. Pairs with map_remove_blank; the solid-outlined cells of
       map_exclude_point/map_include_point act on points that exist. -->
  <rect x="3.5" y="3.5" width="17" height="17" rx="2"
        fill="none" stroke="#f1f1f1" stroke-width="1.8"
        stroke-dasharray="3.6 2.6"/>
  <path d="M12 7.6 V16.4 M7.6 12 H16.4"
        fill="none" stroke="#f1f1f1" stroke-width="2.2"
        stroke-linecap="round"/>
</svg>
