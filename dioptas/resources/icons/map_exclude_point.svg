<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Leave a map point out: a cell struck through. The point keeps its
       place in the grid, which is why the cell outline stays. -->
  <rect x="4.5" y="4.5" width="15" height="15" rx="2"
        fill="none" stroke="#f1f1f1" stroke-width="1.8"/>
  <path d="M7.6 16.4 L16.4 7.6"
        fill="none" stroke="#f1f1f1" stroke-width="2.2"
        stroke-linecap="round"/>
</svg>
