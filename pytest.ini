[pytest]
# Run in parallel by default: the suite is CPU-bound and single-process runs
# take ~7 minutes. --dist loadfile keeps all tests of a file in one worker,
# which preserves within-file order and isolates files from each other's
# global state. Use -n0 to run serially (e.g. when debugging a single test).
addopts = -v --tb=short -n auto --dist loadfile
filterwarnings =
    ignore:Setting the strides on a NumPy array has been deprecated in NumPy 2.4:DeprecationWarning:pyFAI.utils.mathutil
    ignore:Parameter has no default value.*:DeprecationWarning:pyqtgraph.parametertree
    ignore:The fit may be poorly conditioned::numpy.polynomial
