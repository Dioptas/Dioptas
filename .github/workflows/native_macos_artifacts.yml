name: Native macOS artifacts (no publishing)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to build or recover
        type: choice
        options: [both, arm64, intel]
        default: both
      resume_dmg_run_id:
        description: Resume an existing signed DMG submission from this run; no build or new upload
        type: string
        default: ''
      recovery_run_id:
        description: Optional original candidate run with an Apple-accepted app ZIP
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# Do not cancel an Apple submission when another candidate starts.
concurrency:
  group: native-macos-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Signed DMG (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.architecture == 'intel' && '["x86_64-apple-darwin"]' || inputs.architecture == 'arm64' && '["aarch64-apple-darwin"]' || '["aarch64-apple-darwin", "x86_64-apple-darwin"]') }}
    runs-on: ${{ matrix.target == 'x86_64-apple-darwin' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      DIOPTAS_RELEASE_TARGET: ${{ matrix.target }}
      HDF5_PLUGIN_PRELOAD: '::'
      CARGO_TERM_COLOR: always
    steps:
      - name: Validate recovery selection
        env:
          APP_RECOVERY_RUN: ${{ inputs.recovery_run_id }}
          DMG_RESUME_RUN: ${{ inputs.resume_dmg_run_id }}
        run: |
          if [[ -n "$APP_RECOVERY_RUN" && -n "$DMG_RESUME_RUN" ]]; then
            echo "::error::Choose either app recovery or original DMG resumption"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Rust
        if: inputs.resume_dmg_run_id == ''
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
        if: inputs.resume_dmg_run_id == ''
        with:
          workspaces: |
            backend -> target
            src-tauri -> target
          key: native-release-${{ matrix.target }}
      - run: npm ci
      - name: Check shared release configuration
        run: |
          npm run test:release-config
          node --test scripts/peritheos_distribution.test.mjs
      - name: Prepare Developer ID and notarization credentials
        run: python3 installer/macos/signing.py setup
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - name: Restore an already accepted app
        if: inputs.recovery_run_id != '' && inputs.resume_dmg_run_id == ''
        run: node scripts/recover_macos_app.mjs
        env:
          DIOPTAS_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          GH_TOKEN: ${{ github.token }}
      - name: Resume original signed DMG and verify installed app
        if: inputs.resume_dmg_run_id != ''
        run: node scripts/resume_macos_dmg.mjs
        env:
          DIOPTAS_DMG_RESUME_RUN_ID: ${{ inputs.resume_dmg_run_id }}
          GH_TOKEN: ${{ github.token }}
      - name: Build, sign, notarize and verify installed DMG
        if: inputs.resume_dmg_run_id == ''
        run: |
          if [[ -n "${DIOPTAS_RECOVERED_APP:-}" ]]; then
            npm run release:macos -- --notarize --native-smoke --from-app "$DIOPTAS_RECOVERED_APP"
          else
            npm run release:macos -- --notarize --native-smoke
          fi
      - name: Retain installers, checksums and verification
        uses: actions/upload-artifact@v7
        with:
          name: Dioptas-native-${{ matrix.target }}
          path: |
            artifacts/native-release/**/*.dmg
            artifacts/native-release/**/*.app.tar.gz
            artifacts/native-release/**/SHA256SUMS
            artifacts/native-release/**/build.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain notarization logs and recovery payloads
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Dioptas-native-diagnostics-${{ matrix.target }}
          path: |
            artifacts/native-release/**/source.json
            artifacts/native-release/**/dist/notarization/
            artifacts/native-release/**/dist/notarization-payloads/
            artifacts/native-release/**/*.dmg
            artifacts/standalone/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing keychain
        if: always()
        run: python3 installer/macos/signing.py cleanup
