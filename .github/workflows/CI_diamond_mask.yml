name: Experimental diamond mask

on:
  workflow_dispatch:
  push:
    branches: [codex/dynamic-spot-mask]
  pull_request:
    paths:
      - 'dioptas/model/util/mask_plugins/**'
      - 'dioptas/tests/unit_tests/test_BroadSpotMask.py'
      - 'dioptas/tests/unit_tests/test_DiamondSpotMask.py'
      - 'dioptas/tests/unit_tests/test_DiamondROI.py'
      - '.github/workflows/CI_diamond_mask.yml'

jobs:
  focused-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      DIOPTAS_REQUIRE_C_EXT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopengl0 libegl1 libglib2.0-0
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --extra test
      - name: Test masks, spacing rules, missing data, saturation and transforms
        run: >-
          uv run pytest -q
          dioptas/tests/unit_tests/test_BroadSpotMask.py
          dioptas/tests/unit_tests/test_DiamondSpotMask.py
          dioptas/tests/unit_tests/test_DiamondROI.py
          dioptas/tests/unit_tests/test_PowderOutlierMaskPlugin.py
          dioptas/tests/unit_tests/test_MaskPlugin.py
          dioptas/tests/unit_tests/test_MaskCalibrationRefresh.py
