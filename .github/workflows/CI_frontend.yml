# This is a basic workflow to help you get started with Actions

name: CI_frontend

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install Apt Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install python3-opengl libgl1-mesa-dev libglib2.0-0 libxkbcommon-x11-dev libxcb-xinerama0  \
          libxcb-keysyms1-dev libxcb-image0-dev libxcb-icccm4-dev libxcb-sync0-dev libxcb-xfixes0-dev \
          libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-cursor0 libopengl0

    - name: Install dependencies
      run: uv sync --extra test

    - name: Install pyepics
      run: uv pip install pyepics

    - name: Run tests
      run: |
        uv run pytest dioptas/tests/controller_tests/ --ignore=dioptas/tests/controller_tests/test_BatchController_part1.py --ignore=dioptas/tests/controller_tests/test_BatchController_part2.py --ignore=dioptas/tests/controller_tests/test_BatchController_part3.py --ignore=dioptas/tests/controller_tests/test_BatchController_part4.py -p no:forked
