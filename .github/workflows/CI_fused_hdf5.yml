name: CI fused HDF5

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-preview:
    name: Qt with published native wheels
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      RAYON_NUM_THREADS: '4'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          path: qt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v7
      - name: Qt build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglib2.0-0 libxkbcommon-x11-dev libxcb-xinerama0 libxcb-cursor0 libopengl0 libhdf5-dev pkg-config libxml2-dev libxslt1-dev zlib1g-dev
      - name: Install the released native wheels (source builds forbidden)
        run: uv sync --locked --python 3.13 --extra test --extra dioptrin --no-build-package dioptrin --no-build-package dioptrin-io
        working-directory: qt
      - name: Verify published versions and fused API (no skipped native tests)
        run: qt/.venv/bin/python -c "from importlib.metadata import version; import dioptrin_io_fused as f; assert version('dioptrin') == '0.10.0'; assert version('dioptrin-io') == '0.2.0'; assert hasattr(f.FusedHdf5Integrator, 'load_integrate1d')"
      - name: Single-decode, owner-thread, source, masking and bulk regressions
        working-directory: qt
        run: .venv/bin/python -m pytest dioptas/tests/unit_tests/test_fused_single_frame.py dioptas/tests/unit_tests/test_integration_task.py dioptas/tests/controller_tests/test_integration_coordinator.py dioptas/tests/controller_tests/test_async_map_batch.py dioptas/tests/unit_tests/test_batch_task.py dioptas/tests/unit_tests/test_fast_hdf5_pipeline.py dioptas/tests/unit_tests/test_dioptrin_mask_modes.py -q
