# This is a basic workflow to help you get started with Actions

name: CD_LINUX

on:
  push:
    branches: ['**']

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_linux:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      folder_name: 'DioptasLinux'
      DIOPTAS_REQUIRE_C_EXT: "1"
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Apt Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install python3-opengl libgl1-mesa-dev libglib2.0-0

    - name: Setup Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --extra test

    - name: Verify C extension built
      run: uv run python -c "from dioptas.model.util.mask_plugins.powder_outlier import _c_compute_binned; assert _c_compute_binned is not None, 'C extension was not built'"

    - name: Install dioptrin
      if: ${{ env.DIOPTRIN_TOKEN != '' }}
      env:
        DIOPTRIN_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
        GH_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
      run: |
        gh release download --repo CPrescher/Dioptrin --pattern "*cp313*manylinux*x86_64*.whl" --dir /tmp/dioptrin_wheels
        uv pip install /tmp/dioptrin_wheels/*.whl

    - name: Install PyInstaller
      run: uv pip install pyinstaller

    - name: Run Dioptas from source to test
      run: uv run python run.py test

    - name: Run PyInstaller
      run: uv run bash create_executable.sh

    - name: Verify C extension bundled
      shell: bash
      run: |
        matches=$(find dist -name '_powder_outlier_c*' || true)
        if [ -z "$matches" ]; then
          echo "ERROR: _powder_outlier_c not found in PyInstaller bundle"
          exit 1
        fi
        echo "Found C extension in bundle:"
        echo "$matches"

    - name: Run Dioptas from newly created executable to test
      run: |
        cd dist/Dioptas*
        xvfb-run -e /dev/stdout ./Dioptas test

    - name: Determine Folder Name
      run: |
        cd dist
        echo "folder_name=$(ls | grep Dioptas)" >> $GITHUB_ENV

    - name: Upload Compressed App as Artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.folder_name }}
        path: dist/${{ env.folder_name }}

