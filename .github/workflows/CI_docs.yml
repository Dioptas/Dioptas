name: Native documentation
on:
  push:
    branches: [develop]
    paths: ['docs/**', '.readthedocs.yaml', '.github/workflows/CI_docs.yml']
  pull_request:
    branches: [develop]
    paths: ['docs/**', '.readthedocs.yaml', '.github/workflows/CI_docs.yml']
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r docs/requirements.txt
      - run: sphinx-build -W --keep-going -b html docs/source docs/_build/html
