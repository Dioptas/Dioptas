# This is a basic workflow to help you get started with Actions

name: CD_WINDOWS

on:
  push:
    branches: ['**']

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build_windows:
    # The type of runner that the job will run on
    runs-on: windows-latest
    env:
      folder_name: 'DioptasWin'
      DIOPTAS_REQUIRE_C_EXT: "1"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --extra test

    - name: Verify C extension built
      run: uv run python -c "from dioptas.model.util.mask_plugins.powder_outlier import _c_compute_binned; assert _c_compute_binned is not None, 'C extension was not built'"

    - name: Install dioptrin
      if: ${{ env.DIOPTRIN_TOKEN != '' }}
      shell: bash
      env:
        DIOPTRIN_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
        GH_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
      run: |
        gh release download --repo CPrescher/Dioptrin --pattern "*cp313*win*.whl" --dir "${{ runner.temp }}/dioptrin_wheels"
        uv pip install "${{ runner.temp }}"/dioptrin_wheels/*.whl

    - name: Install PyInstaller
      run: uv pip install pyinstaller

    - name: Run Dioptas from source to test
      run: uv run python run.py test

    - name: Run PyInstaller
      shell: cmd
      run: uv run pyinstaller Dioptas.spec

    - name: Verify C extension bundled
      shell: bash
      run: |
        matches=$(find dist -name '_powder_outlier_c*' || true)
        if [ -z "$matches" ]; then
          echo "ERROR: _powder_outlier_c not found in PyInstaller bundle"
          exit 1
        fi
        echo "Found C extension in bundle:"
        echo "$matches"

    - name: Run Dioptas Executable from Dist Folder
      shell: cmd
      run: |
        cd dist\Dioptas*
        Dioptas.exe test

    - name: Determine Folder Name
      run: |
        cd dist\Dioptas*
        echo "folder_name=$(pwd | Select-Object | %{$_.ProviderPath.Split("\")[-1]})"
        echo "folder_name=$(pwd | Select-Object | %{$_.ProviderPath.Split("\")[-1]})" >> $env:GITHUB_ENV

    - name: Upload Compressed App as Artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.folder_name }}
        path: dist\Dioptas*

