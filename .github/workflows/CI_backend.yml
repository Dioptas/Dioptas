# This is a basic workflow to help you get started with Actions

name: CI_backend

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14', '3.15']
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install Apt Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install python3-opengl libgl1-mesa-dev libglib2.0-0 libhdf5-dev pkg-config libxml2-dev libxslt1-dev zlib1g-dev

    - name: Install dependencies
      run: uv sync --extra test

    - name: Run tests with coverage
      run: |
        uv run pytest dioptas/tests/unit_tests/ --cov --cov-report=term-missing --cov-report=xml

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml
