name: Experimental single crystal
on:
  push:
    branches: [codex/single-crystal-mode]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spot-mode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      DIOPTAS_REQUIRE_C_EXT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: CPrescher/PhaseSmith
          ref: f166525af743bcfa63c6e132101730d907b5927d
          path: experimental-backend
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libglib2.0-0
      - run: python -m pip install maturin
      - working-directory: experimental-backend
        run: maturin build --release --locked --features experimental-spots --out dist-experimental
      - run: python -m pip install -e '.[test]'
      - shell: bash
        run: python -m pip install --force-reinstall --no-deps experimental-backend/dist-experimental/*.whl
      - run: python -c "from dioptas.model.single_crystal import backend_available; assert backend_available()"
      - run: python -c "from dioptas.model.util.omega_background import _omega_arpls; assert _omega_arpls is not None"
      - run: python -m pytest -n0 dioptas/tests/unit_tests/test_OmegaBackground.py dioptas/tests/controller_tests/test_OmegaBackgroundController.py
      - run: python -m pytest -n0 dioptas/tests/unit_tests/test_SingleCrystalSpots.py dioptas/tests/controller_tests/test_SingleCrystalController.py dioptas/tests/unit_tests/test_RotationSeries.py dioptas/tests/unit_tests/test_SingleCrystalIndexing.py dioptas/tests/unit_tests/test_SingleCrystalRefinement.py dioptas/tests/unit_tests/test_SingleCrystalCells.py dioptas/tests/unit_tests/test_PatternMouseViewBox.py dioptas/tests/unit_tests/test_FileDialogFallback.py
