# Build the same distribution artifacts for PR validation and tagged releases.
name: Build packages

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # macOS 14 runners are retired. Build OpenMP for macOS 14 on a
          # supported runner so the wheel keeps its existing deployment target.
          - os: macos-15
            openmp: true
            cibw_env_macos: MACOSX_DEPLOYMENT_TARGET=14.0
          # Intel: built WITHOUT OpenMP on purpose. Installing libomp here
          # would force this wheel's minimum up to the runner's macOS version
          # too, which would exclude most of the Intel Macs still in use. The
          # omp pragma is simply ignored without it, so the spot-mask outlier
          # detection runs serially and nothing else changes.
          # (macos-13 was removed by GitHub: that job never got a runner and
          # hung for the full 24h workflow limit, which is what blocked the
          # 0.8.6 PyPI release.)
          - os: macos-15-intel
            cibw_env_macos: DIOPTAS_NO_OPENMP=1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build portable OpenMP (macOS)
        if: matrix.openmp
        run: bash installer/macos/build_portable_libomp.sh "$RUNNER_TEMP/dioptas-libomp" 14.0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ENVIRONMENT_MACOS: DIOPTAS_REQUIRE_C_EXT=1 ${{ matrix.cibw_env_macos }} DIOPTAS_LIBOMP_PREFIX=${{ env.DIOPTAS_LIBOMP_PREFIX }}

      - name: Verify each wheel contains the C extension
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          wheels = sorted(Path("wheelhouse").glob("*.whl"))
          if not wheels:
              raise SystemExit("ERROR: cibuildwheel produced no wheels")
          for wheel in wheels:
              with ZipFile(wheel) as archive:
                  entries = [PurePosixPath(name) for name in archive.namelist()]
              if not any(entry.name.startswith("_powder_outlier_c.")
                         and entry.suffix in (".so", ".pyd") for entry in entries):
                  raise SystemExit(f"ERROR: {wheel} does not contain _powder_outlier_c")
          print(f"All {len(wheels)} wheel(s) contain the C extension.")

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

