name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build_linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      DIOPTAS_REQUIRE_C_EXT: "1"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install Apt Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install python3-opengl libgl1-mesa-dev libglib2.0-0

    - name: Setup Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --extra test

    - name: Verify C extension built
      run: uv run python -c "from dioptas.model.util.mask_plugins.powder_outlier import _c_compute_binned; assert _c_compute_binned is not None, 'C extension was not built'"

    - name: Install dioptrin
      if: ${{ env.DIOPTRIN_TOKEN != '' }}
      env:
        DIOPTRIN_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
        GH_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
      run: |
        gh release download --repo CPrescher/Dioptrin --pattern "*cp313*manylinux*x86_64*.whl" --dir /tmp/dioptrin_wheels
        uv pip install /tmp/dioptrin_wheels/*.whl

    - name: Install PyInstaller
      run: uv pip install pyinstaller

    - name: Run Dioptas from source to test
      run: uv run python run.py test

    - name: Run PyInstaller
      run: uv run bash create_executable.sh

    - name: Verify C extension bundled
      shell: bash
      run: |
        matches=$(find dist -name '_powder_outlier_c*' || true)
        if [ -z "$matches" ]; then
          echo "ERROR: _powder_outlier_c not found in PyInstaller bundle"
          exit 1
        fi
        echo "Found C extension in bundle:"
        echo "$matches"

    - name: Run Dioptas from newly created executable to test
      run: |
        cd dist/Dioptas*
        xvfb-run -e /dev/stdout ./Dioptas test

    - name: Compress executable
      run: |
        cd dist
        DIOPTAS_FOLDER=$(ls -d Dioptas*)
        tar -czf Dioptas_Linux.tar.gz "$DIOPTAS_FOLDER"

    - name: Create AppImage
      run: |
        cd dist
        DIOPTAS_FOLDER=$(ls -d Dioptas_Linux*/ | head -1 | sed 's|/$||')

        # Download appimagetool
        wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
        chmod +x appimagetool

        # Build AppDir structure
        mkdir -p Dioptas.AppDir/usr/bin
        mkdir -p Dioptas.AppDir/usr/share/icons/hicolor/256x256/apps
        cp -r "$DIOPTAS_FOLDER"/* Dioptas.AppDir/usr/bin/
        cp ../installer/linux/Dioptas.desktop Dioptas.AppDir/
        cp ../dioptas/resources/icons/icon.png Dioptas.AppDir/dioptas.png
        cp ../dioptas/resources/icons/icon.png Dioptas.AppDir/usr/share/icons/hicolor/256x256/apps/dioptas.png

        # Create AppRun
        printf '#!/bin/bash\nSELF=$(readlink -f "$0")\nHERE=${SELF%%/*}\nexec "${HERE}/usr/bin/Dioptas" "$@"\n' > Dioptas.AppDir/AppRun
        chmod +x Dioptas.AppDir/AppRun

        # Build AppImage
        ARCH=x86_64 ./appimagetool Dioptas.AppDir Dioptas_Linux.AppImage

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-executable
        path: |
          dist/Dioptas_Linux.tar.gz
          dist/Dioptas_Linux.AppImage

  build_windows:
    runs-on: windows-latest
    env:
      DIOPTAS_REQUIRE_C_EXT: "1"
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --extra test

    - name: Verify C extension built
      run: uv run python -c "from dioptas.model.util.mask_plugins.powder_outlier import _c_compute_binned; assert _c_compute_binned is not None, 'C extension was not built'"

    - name: Install dioptrin
      if: ${{ env.DIOPTRIN_TOKEN != '' }}
      shell: bash
      env:
        DIOPTRIN_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
        GH_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
      run: |
        gh release download --repo CPrescher/Dioptrin --pattern "*cp313*win*.whl" --dir "${{ runner.temp }}/dioptrin_wheels"
        uv pip install "${{ runner.temp }}"/dioptrin_wheels/*.whl

    - name: Install PyInstaller
      run: uv pip install pyinstaller

    - name: Run Dioptas from source to test
      run: uv run python run.py test

    - name: Run PyInstaller
      shell: cmd
      run: uv run pyinstaller Dioptas.spec

    - name: Verify C extension bundled
      shell: bash
      run: |
        matches=$(find dist -name '_powder_outlier_c*' || true)
        if [ -z "$matches" ]; then
          echo "ERROR: _powder_outlier_c not found in PyInstaller bundle"
          exit 1
        fi
        echo "Found C extension in bundle:"
        echo "$matches"

    - name: Run Dioptas Executable from Dist Folder
      shell: cmd
      run: |
        cd dist\Dioptas*
        Dioptas.exe test

    - name: Compress executable
      run: |
        cd dist
        $folderName = (Get-ChildItem -Directory -Filter "Dioptas*").Name
        Compress-Archive -Path $folderName -DestinationPath "Dioptas_Windows.zip"

    - name: Create Windows Installer
      run: |
        $folderName = (Get-ChildItem -Directory -Path dist -Filter "Dioptas*").FullName
        $tag = "${{ github.ref_name }}"
        iscc /DDioptasVersion=$tag /DDioptasFolder=$folderName installer\windows\dioptas.iss

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: |
          dist/Dioptas_Windows.zip
          dist/Dioptas_*_Setup.exe

  build_macos:
    runs-on: macos-latest
    env:
      DIOPTAS_REQUIRE_C_EXT: "1"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install OpenMP
      run: brew install libomp

    - name: Setup Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --extra test

    - name: Verify C extension built
      run: uv run python -c "from dioptas.model.util.mask_plugins.powder_outlier import _c_compute_binned; assert _c_compute_binned is not None, 'C extension was not built'"

    - name: Install dioptrin
      if: ${{ env.DIOPTRIN_TOKEN != '' }}
      env:
        DIOPTRIN_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
        GH_TOKEN: ${{ secrets.DIOPTRIN_TOKEN }}
      run: |
        gh release download --repo CPrescher/Dioptrin --pattern "*cp313*arm64*.whl" --dir /tmp/dioptrin_wheels
        uv pip install /tmp/dioptrin_wheels/*.whl

    - name: Install PyInstaller
      run: uv pip install pyinstaller

    - name: Run Dioptas from source to test
      run: uv run python run.py test

    - name: Run PyInstaller
      run: uv run bash create_executable.sh

    - name: Verify C extension bundled
      shell: bash
      run: |
        matches=$(find dist -name '_powder_outlier_c*' || true)
        if [ -z "$matches" ]; then
          echo "ERROR: _powder_outlier_c not found in PyInstaller bundle"
          exit 1
        fi
        echo "Found C extension in bundle:"
        echo "$matches"

    - name: Ad-hoc Codesign App Bundle
      run: codesign --force --deep --sign - dist/Dioptas*.app

    - name: Run Dioptas Executable
      run: |
        cd dist/Dioptas*
        cd Contents/MacOS
        ./run_dioptas test

    - name: Compress executable
      run: |
        cd dist
        tar -czf Dioptas_MacOS.tar.gz Dioptas*.app

    - name: Create DMG
      run: |
        brew install create-dmg
        cd dist
        APP_NAME=$(ls -d Dioptas*.app)
        create-dmg \
          --volname "Dioptas" \
          --volicon "../dioptas/resources/icons/icon.icns" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "$APP_NAME" 150 190 \
          --app-drop-link 450 190 \
          --no-internet-enable \
          "Dioptas_MacOS.dmg" \
          "$APP_NAME" || true
        # create-dmg returns non-zero when it can't set custom icon positions
        # in CI (no GUI session), but the DMG is still created correctly
        test -f Dioptas_MacOS.dmg

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-executable
        path: |
          dist/Dioptas_MacOS.tar.gz
          dist/Dioptas_MacOS.dmg

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          # Apple silicon: built WITH OpenMP. Homebrew's libomp on this runner
          # has a minimum target of macOS 14, and delocate refuses to bundle a
          # library into a wheel tagged for an older macOS, so the wheel's
          # target is raised to match. Apple silicon Macs all run 14 or newer
          # in practice; older ones fall back to the sdist.
          - os: macos-14
            openmp: true
            cibw_env_macos: MACOSX_DEPLOYMENT_TARGET=14.0
          # Intel: built WITHOUT OpenMP on purpose. Installing libomp here
          # would force this wheel's minimum up to the runner's macOS version
          # too, which would exclude most of the Intel Macs still in use. The
          # omp pragma is simply ignored without it, so the spot-mask outlier
          # detection runs serially and nothing else changes.
          # (macos-13 was removed by GitHub: that job never got a runner and
          # hung for the full 24h workflow limit, which is what blocked the
          # 0.8.6 PyPI release.)
          - os: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenMP (macOS)
        if: matrix.openmp
        run: brew install libomp

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ENVIRONMENT_MACOS: ${{ matrix.cibw_env_macos }}

      - name: Verify each wheel contains the C extension
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "ERROR: cibuildwheel produced no wheels"
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            if ! unzip -l "$wheel" | grep -qE '_powder_outlier_c\.[^/[:space:]]+\.(so|pyd)$'; then
              echo "ERROR: $wheel does not contain _powder_outlier_c"
              unzip -l "$wheel" | grep -i powder || true
              exit 1
            fi
          done
          echo "All ${#wheels[@]} wheel(s) contain the C extension."

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  create_release:
    needs: [build_linux, build_windows, build_macos]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Extract changelog for this version
      id: changelog
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        # Extract the section for this version from changelog.md
        # Matches from "# X.Y.Z" until the next "# " header
        BODY=$(awk "/^# ${TAG} /{found=1; next} /^# [0-9]/{if(found) exit} found{print}" changelog.md)
        # Write to file to preserve multiline content
        echo "$BODY" > release_notes.md
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.changelog.outputs.tag }}"
        gh release create "$TAG" \
          --title "Dioptas $TAG" \
          --notes-file release_notes.md \
          artifacts/linux-executable/Dioptas_Linux.tar.gz \
          artifacts/linux-executable/Dioptas_Linux.AppImage \
          artifacts/windows-executable/Dioptas_Windows.zip \
          artifacts/windows-executable/Dioptas_*_Setup.exe \
          artifacts/macos-executable/Dioptas_MacOS.tar.gz \
          artifacts/macos-executable/Dioptas_MacOS.dmg

  pypi-publish:
    name: Upload release to PyPI
    needs: [build_wheels, build_sdist, create_release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dioptas/
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Check the dist folder
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  verify_release_complete:
    # The 0.8.6 release created the GitHub release but published nothing to
    # PyPI: one wheel job failed and pypi-publish was silently *skipped*, so
    # the run needed a click-through to notice. This job makes that loud.
    name: Verify the release is complete
    needs: [create_release, pypi-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if PyPI publishing did not run
        run: |
          publish="${{ needs.pypi-publish.result }}"
          if [ "$publish" != "success" ]; then
            echo "::error::PyPI publish did not succeed (result: $publish)."
            echo "The GitHub release and its executables may still exist,"
            echo "so check what is already published before re-tagging."
            exit 1
          fi
          echo "GitHub release and PyPI publish both succeeded."
