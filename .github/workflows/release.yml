name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  DIOPTRIN_RELEASE: "v0.8.0"

jobs:
  build_linux:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      DIOPTAS_REQUIRE_C_EXT: "1"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install Apt Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install python3-opengl libgl1-mesa-dev libglib2.0-0

    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --locked --extra test --extra dioptrin

    - name: Verify C extension built
      run: uv run --extra dioptrin python -c "from dioptas.model.util.mask_plugins.powder_outlier import _c_compute_binned; assert _c_compute_binned is not None, 'C extension was not built'"

    - name: Verify Dioptrin version
      run: |
        uv run --extra dioptrin python -c "import os; from importlib.metadata import version; actual = version('dioptrin'); expected = os.environ['DIOPTRIN_RELEASE'].removeprefix('v'); assert actual == expected, f'Expected Dioptrin {expected}, got {actual}'; print(f'Dioptrin {actual}')"

    - name: Test Dioptrin integration and pyFAI fallback
      env:
        DIOPTAS_REQUIRE_DIOPTRIN: "1"
      run: uv run --extra test --extra dioptrin python -m pytest dioptas/tests/unit_tests/test_dioptrin_release.py dioptas/tests/unit_tests/test_dioptrin_availability.py -q

    - name: Install PyInstaller
      run: uv pip install pyinstaller

    - name: Run Dioptas from source to test
      run: uv run --extra dioptrin python run.py test

    - name: Run PyInstaller
      run: uv run --extra dioptrin bash create_executable.sh

    - name: Verify C extension bundled
      shell: bash
      run: |
        matches=$(find dist -name '_powder_outlier_c*' || true)
        if [ -z "$matches" ]; then
          echo "ERROR: _powder_outlier_c not found in PyInstaller bundle"
          exit 1
        fi
        echo "Found C extension in bundle:"
        echo "$matches"

    - name: Run Dioptas from newly created executable to test
      run: |
        cd dist/Dioptas*
        xvfb-run -e /dev/stdout ./Dioptas test

    - name: Compress executable
      run: |
        cd dist
        DIOPTAS_FOLDER=$(ls -d Dioptas*)
        tar -czf Dioptas_Linux.tar.gz "$DIOPTAS_FOLDER"

    - name: Build and test AppImage
      run: bash installer/linux/build_appimage.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: linux-executable
        path: |
          dist/Dioptas_Linux.tar.gz
          dist/Dioptas_Linux.AppImage

  build_windows:
    runs-on: windows-latest
    env:
      DIOPTAS_REQUIRE_C_EXT: "1"
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --locked --extra test --extra dioptrin

    - name: Verify C extension built
      run: uv run --extra dioptrin python -c "from dioptas.model.util.mask_plugins.powder_outlier import _c_compute_binned; assert _c_compute_binned is not None, 'C extension was not built'"

    - name: Verify Dioptrin version
      run: |
        uv run --extra dioptrin python -c "import os; from importlib.metadata import version; actual = version('dioptrin'); expected = os.environ['DIOPTRIN_RELEASE'].removeprefix('v'); assert actual == expected, f'Expected Dioptrin {expected}, got {actual}'; print(f'Dioptrin {actual}')"

    - name: Test Dioptrin integration and pyFAI fallback
      env:
        DIOPTAS_REQUIRE_DIOPTRIN: "1"
      run: uv run --extra test --extra dioptrin python -m pytest dioptas/tests/unit_tests/test_dioptrin_release.py dioptas/tests/unit_tests/test_dioptrin_availability.py -q

    - name: Install PyInstaller
      run: uv pip install pyinstaller

    - name: Run Dioptas from source to test
      run: uv run --extra dioptrin python run.py test

    - name: Run PyInstaller
      shell: cmd
      run: uv run --extra dioptrin pyinstaller Dioptas.spec

    - name: Verify C extension bundled
      shell: bash
      run: |
        matches=$(find dist -name '_powder_outlier_c*' || true)
        if [ -z "$matches" ]; then
          echo "ERROR: _powder_outlier_c not found in PyInstaller bundle"
          exit 1
        fi
        echo "Found C extension in bundle:"
        echo "$matches"

    - name: Run Dioptas Executable from Dist Folder
      shell: cmd
      run: |
        cd dist\Dioptas*
        Dioptas.exe test

    - name: Compress executable
      run: |
        cd dist
        $folderName = (Get-ChildItem -Directory -Filter "Dioptas*").Name
        Compress-Archive -Path $folderName -DestinationPath "Dioptas_Windows.zip"

    - name: Create Windows Installer
      run: |
        $folderName = (Get-ChildItem -Directory -Path dist -Filter "Dioptas*").FullName
        $tag = "${{ github.ref_name }}"
        iscc /DDioptasVersion=$tag /DDioptasFolder=$folderName installer\windows\dioptas.iss

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: windows-executable
        path: |
          dist/Dioptas_Windows.zip
          dist/Dioptas_*_Setup.exe

  build_macos:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      DIOPTAS_REQUIRE_C_EXT: "1"
      # Build xypattern for older macOS instead of bundling its macOS 26 wheel.
      UV_NO_BINARY_PACKAGE: xypattern
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build portable OpenMP
      run: bash installer/macos/build_portable_libomp.sh "$RUNNER_TEMP/dioptas-libomp" "$MACOSX_DEPLOYMENT_TARGET"

    - name: Setup Python 3.13
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Set up Developer ID signing and notarization
      run: python installer/macos/signing.py setup
      env:
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    - name: Install uv
      run: python -m pip install --upgrade pip uv

    - name: Install dependencies
      run: uv sync --locked --extra test --extra dioptrin

    - name: Verify C extension built
      run: uv run --extra dioptrin python -c "from dioptas.model.util.mask_plugins.powder_outlier import _c_compute_binned; assert _c_compute_binned is not None, 'C extension was not built'"

    - name: Verify Dioptrin version
      run: |
        uv run --extra dioptrin python -c "import os; from importlib.metadata import version; actual = version('dioptrin'); expected = os.environ['DIOPTRIN_RELEASE'].removeprefix('v'); assert actual == expected, f'Expected Dioptrin {expected}, got {actual}'; print(f'Dioptrin {actual}')"

    - name: Test Dioptrin integration and pyFAI fallback
      env:
        DIOPTAS_REQUIRE_DIOPTRIN: "1"
      run: uv run --extra test --extra dioptrin python -m pytest dioptas/tests/unit_tests/test_dioptrin_release.py dioptas/tests/unit_tests/test_dioptrin_availability.py -q

    - name: Install PyInstaller
      run: uv pip install pyinstaller

    - name: Run Dioptas from source to test
      run: uv run --extra dioptrin python run.py test

    - name: Run PyInstaller
      run: uv run --extra dioptrin bash create_executable.sh

    - name: Verify macOS deployment target
      run: uv run --extra dioptrin python installer/macos/check_compatibility.py dist/Dioptas*.app --target "$MACOSX_DEPLOYMENT_TARGET"

    - name: Verify C extension bundled
      shell: bash
      run: |
        matches=$(find dist -name '_powder_outlier_c*' || true)
        if [ -z "$matches" ]; then
          echo "ERROR: _powder_outlier_c not found in PyInstaller bundle"
          exit 1
        fi
        echo "Found C extension in bundle:"
        echo "$matches"

    - name: Verify Developer ID signature
      run: python installer/macos/signing.py verify dist/Dioptas*.app

    - name: Run Dioptas Executable
      run: |
        cd dist/Dioptas*
        cd Contents/MacOS
        ./run_dioptas test

    - name: Notarize and staple app before packaging
      run: python installer/macos/signing.py notarize dist/Dioptas*.app

    - name: Compress executable
      run: |
        cd dist
        tar -czf Dioptas_MacOS.tar.gz Dioptas*.app

    - name: Create DMG
      run: bash installer/macos/create_dmg.sh

    - name: Sign, notarize and staple DMG
      run: python installer/macos/signing.py notarize dist/Dioptas_MacOS.dmg

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: macos-executable
        path: |
          dist/Dioptas_MacOS.tar.gz
          dist/Dioptas_MacOS.dmg

    - name: Upload notarization logs
      if: ${{ always() && env.DIOPTAS_CODESIGN_IDENTITY != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: macos-notarization-logs
        path: dist/notarization/
        if-no-files-found: ignore

    - name: Preserve signed payloads if notarization or packaging fails
      if: ${{ failure() && env.DIOPTAS_CODESIGN_IDENTITY != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: macos-notarization-recovery
        retention-days: 7
        if-no-files-found: ignore
        path: |
          dist/notarization-payloads/
          dist/notarization/
          dist/Dioptas_MacOS.dmg

    - name: Remove signing keychain and credentials
      if: always()
      run: python installer/macos/signing.py cleanup

  build_packages:
    uses: ./.github/workflows/build_packages.yml

  create_release:
    needs: [build_linux, build_windows, build_macos]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Extract changelog for this version
      id: changelog
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        # Extract the section for this version from changelog.md
        # Matches from "# X.Y.Z" until the next "# " header
        BODY=$(awk "/^# ${TAG} /{found=1; next} /^# [0-9]/{if(found) exit} found{print}" changelog.md)
        # Write to file to preserve multiline content
        echo "$BODY" > release_notes.md
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.changelog.outputs.tag }}"
        gh release create "$TAG" \
          --title "Dioptas $TAG" \
          --notes-file release_notes.md \
          artifacts/linux-executable/Dioptas_Linux.tar.gz \
          artifacts/linux-executable/Dioptas_Linux.AppImage \
          artifacts/windows-executable/Dioptas_Windows.zip \
          artifacts/windows-executable/Dioptas_*_Setup.exe \
          artifacts/macos-executable/Dioptas_MacOS.tar.gz \
          artifacts/macos-executable/Dioptas_MacOS.dmg

  pypi-publish:
    name: Upload release to PyPI
    needs: [build_packages, create_release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dioptas/
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Check the dist folder
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  verify_release_complete:
    # The 0.8.6 release created the GitHub release but published nothing to
    # PyPI: one wheel job failed and pypi-publish was silently *skipped*, so
    # the run needed a click-through to notice. This job makes that loud.
    name: Verify the release is complete
    needs: [create_release, pypi-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if PyPI publishing did not run
        run: |
          publish="${{ needs.pypi-publish.result }}"
          if [ "$publish" != "success" ]; then
            echo "::error::PyPI publish did not succeed (result: $publish)."
            echo "The GitHub release and its executables may still exist,"
            echo "so check what is already published before re-tagging."
            exit 1
          fi
          echo "GitHub release and PyPI publish both succeeded."
