name: Native Windows artifacts (no publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-windows-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installer and installed app
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      HDF5_PLUGIN_PRELOAD: '::'
      VSLANG: '1033'
    steps:
      - name: Enable long checkout paths
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: native-windows-x64
          cache-on-failure: true
      - run: npm ci
      - name: Test release policy and dependency inspection
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/verify_windows_installer.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          node scripts/check_hdf5_windows_abi.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:release-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:windows-release-config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/standalone_licenses.test.mjs scripts/peritheos_distribution.test.mjs
      - name: Test release-mode native Windows processor
        run: cargo test --release --locked --manifest-path backend/Cargo.toml --all-features --no-fail-fast
      - name: Diagnose a failed native HDF5 master test
        if: failure()
        run: cargo test --release --locked --manifest-path backend/Cargo.toml --test integration -- hdf5_master_vds --test-threads=1 --nocapture
      - name: Build unsigned offline installer and upgrade fixture
        run: npm run release:windows -- --unsigned --test-upgrade
      - name: Test install, native WebView2, upgrade and uninstall
        run: ./scripts/verify_windows_installer.ps1
      - name: Retain verified test installers
        uses: actions/upload-artifact@v7
        with:
          name: Dioptas-native-windows-x64-unsigned-test
          path: |
            artifacts/native-windows/**/*.exe
            artifacts/native-windows/**/SHA256SUMS
            artifacts/native-windows/**/build.json
            artifacts/native-windows/**/verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Dioptas-native-windows-diagnostics
          path: artifacts/native-windows/
          if-no-files-found: ignore
          retention-days: 14
