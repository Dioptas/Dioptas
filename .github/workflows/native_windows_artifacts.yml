name: Native Windows artifacts (no publishing)

on:
  workflow_dispatch:
  # Bootstrap this implementation branch; candidates become manual-only
  # after the initial Windows qualification run.
  push:
    branches: ['codex/native-installers']
    paths: ['.github/workflows/native_windows_artifacts.yml', 'desktop/scripts/*windows*', 'desktop/src-tauri/tauri.windows-release.conf.json']

permissions:
  contents: read

concurrency:
  group: native-windows-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64 installer and installed app
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      HDF5_PLUGIN_PRELOAD: '::'
      VSLANG: '1033'
    steps:
      - name: Enable long checkout paths
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/backend -> target
            desktop/src-tauri -> target
          key: native-windows-x64
          cache-on-failure: true
      - run: npm ci
        working-directory: desktop
      - name: Test release policy and dependency inspection
        run: npm run test:release-config; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; npm run test:windows-release-config
        working-directory: desktop
      - name: Build unsigned offline installer and upgrade fixture
        run: npm run release:windows -- --unsigned --test-upgrade
        working-directory: desktop
      - name: Test install, native WebView2, upgrade and uninstall
        run: ./desktop/scripts/verify_windows_installer.ps1
      - name: Test native Windows processor
        run: cargo test --locked --manifest-path desktop/backend/Cargo.toml --all-features
      - name: Retain verified test installers
        uses: actions/upload-artifact@v7
        with:
          name: Dioptas-native-windows-x64-unsigned-test
          path: |
            desktop/artifacts/native-windows/**/*.exe
            desktop/artifacts/native-windows/**/SHA256SUMS
            desktop/artifacts/native-windows/**/build.json
            desktop/artifacts/native-windows/**/verification.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Dioptas-native-windows-diagnostics
          path: desktop/artifacts/native-windows/
          if-no-files-found: ignore
          retention-days: 14
