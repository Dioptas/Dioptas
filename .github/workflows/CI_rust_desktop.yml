name: Rust desktop

on:
  push:
    paths: ['desktop/**', 'README.md', '.github/workflows/CI_rust_desktop.yml']
  pull_request:
    paths: ['desktop/**', 'README.md', '.github/workflows/CI_rust_desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HDF5_PLUGIN_PRELOAD: '::'

# Rust caches are saved only from develop. Pull requests and other branches
# restore develop's caches without saving their own, which keeps the shared
# cache quota from evicting the develop entries every job falls back to.
jobs:
  processor:
    name: Native processor (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Install Rust tools
        # llvm-tools-preview is only used by the Linux coverage run.
        run: rustup update stable && rustup component add clippy rustfmt ${{ runner.os == 'Linux' && 'llvm-tools-preview' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/backend -> target
          key: processor-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # A prebuilt, pinned binary instead of compiling the tool on every run.
      - name: Install cargo-llvm-cov
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Run native processor gate (no Python environment)
        # On Linux the gate runs the all-features tests once, instrumented by
        # cargo-llvm-cov, and writes desktop/artifacts/coverage (lcov.info and
        # html/) instead of rebuilding and rerunning them for coverage
        # afterwards. They therefore run uninstrumented only on macOS.
        env:
          DIOPTAS_GATE_COVERAGE: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: node desktop/scripts/check_native_desktop.mjs --processor
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-processor-${{ runner.os }}
          path: desktop/artifacts/

  desktop:
    name: Headless desktop and Tauri host
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/backend -> target
            desktop/src-tauri -> target
          key: desktop-macos
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: npm ci
        working-directory: desktop
      - run: npx playwright install chromium webkit
        working-directory: desktop
      - name: Prepare and test the native host (no application window)
        run: node desktop/scripts/check_native_desktop.mjs --host
      - name: Run headless UI, data flow and stdio checks
        run: node desktop/scripts/check_native_desktop.mjs --ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-desktop-headless
          path: desktop/artifacts/

  linux-security:
    name: Linux Tauri dependencies and GLib security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Linux Tauri and GLib development dependencies
        # https://v2.tauri.app/start/prerequisites/#linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config libssl-dev libgtk-3-dev libglib2.0-dev libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        run: rustup update stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/backend -> target
            desktop/src-tauri -> target
            desktop/security/glib-regression -> target
          key: linux-tauri-glib-security
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: Verify the exact reviewed GLib source backport
        run: node desktop/scripts/check_glib_backport.mjs
      - run: npm ci
        working-directory: desktop
      - name: Stage the native processor and build the frontend
        working-directory: desktop
        run: npm run backend:prepare -- --debug && npm run build
      - name: Check the real Linux Tauri dependency graph
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml --jobs 2
      - name: Exercise the optimized GLib security regression
        run: cargo test --release --locked --manifest-path desktop/security/glib-regression/Cargo.toml --jobs 2
      - name: Check live advisories for the original registry GLib version
        run: node desktop/scripts/check_glib_backport.mjs --advisories
