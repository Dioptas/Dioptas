services:
  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: eos_db
    environment:
      POSTGRES_USER: eos_user
      POSTGRES_PASSWORD: eos_password
      POSTGRES_DB: eos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eos_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI application
  api:
    build: .
    container_name: eos_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./client:/app/client
      # Mount your JCPDS files directory (update path as needed)
      - ~/Desktop/DATABASE/eos_database/JCPDSv1:/data/jcpds:ro

volumes:
  postgres_data:
