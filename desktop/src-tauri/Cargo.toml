[package]
name = "dioptas-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "MIT"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSColorPanel", "NSPanel", "NSSavePanel", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["block2"] }
