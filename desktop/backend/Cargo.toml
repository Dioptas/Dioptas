[package]
name = "dioptas-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Python-free Dioptas desktop processing boundary"

[features]
default = []
# Engine selection is independent of file input; Dioptrin remains optional.
dioptrin = ["dep:dioptrin"]

[dependencies]
dioptrin-io = { git = "https://github.com/CPrescher/dioptrin-io", rev = "cf33ecf89c1aaafa95982df491d90a38e15c2332", features = ["wrappers", "hdf5", "containers", "bruker", "oxford", "raxis", "fixed", "fit2d", "kcd", "mpa", "esperanto", "mar345", "xsd"] }
dioptrin = { git = "https://github.com/CPrescher/Dioptrin", rev = "bc27eb5bfae376f83ecc99befc7b578624a7dfbd", optional = true, default-features = false }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
tiff = "0.8"
hdf5 = { package = "hdf5-metno", version = "=0.15.1", features = ["static", "zlib", "lzf"] }

[[bin]]
name = "dioptas-processor"
path = "src/main.rs"

[workspace]

# Keep the real-image native algorithms practical in the development preview.
# This changes optimization only, not float arithmetic policy or CPU target.
[profile.dev.package.dioptrin]
opt-level = 2
