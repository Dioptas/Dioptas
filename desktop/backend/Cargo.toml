[package]
name = "dioptas-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
description = "Python-free Dioptas desktop processing boundary"

[features]
default = ["dioptrin"]
# Dioptrin is the default engine; retain the diagnostic non-numerical build.
dioptrin = []

[dependencies]
dioptrin-io = { git = "https://github.com/CPrescher/dioptrin-io", rev = "344011962df431a6a47e3a3fb727aa9c65df3131", features = ["wrappers", "hdf5", "containers", "bruker", "oxford", "raxis", "fixed", "fit2d", "kcd", "mpa", "esperanto", "mar345", "xsd"] }
dioptrin = { git = "https://github.com/CPrescher/Dioptrin", rev = "0c0d4fccc2b38a5f53b481ebf507c80cfb9a44c6", default-features = false }
half = "2"
serde = { version = "1", features = ["derive", "rc"] }
# Preserve the established ordering of plugin controls in embedded schemas.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
phasesmith-core = { git = "https://github.com/CPrescher/PhaseSmith", rev = "f0925305c70fc8ea5965d14f03aa51b8399621d8" }
phasesmith-crystallography = { git = "https://github.com/CPrescher/PhaseSmith", rev = "f0925305c70fc8ea5965d14f03aa51b8399621d8" }
phasesmith-io = { git = "https://github.com/CPrescher/PhaseSmith", rev = "f0925305c70fc8ea5965d14f03aa51b8399621d8" }
phasesmith-model = { git = "https://github.com/CPrescher/PhaseSmith", rev = "f0925305c70fc8ea5965d14f03aa51b8399621d8" }
peritheos = { git = "https://github.com/CPrescher/peritheos", rev = "3c79b1aedf28c348a49cc22d9f24d92895546283" }
nalgebra = "0.35"
tiff = "0.8"
base64 = "0.22"
png = "0.18"
roxmltree = "0.21"
csv = "1"
hdf5 = { package = "hdf5-metno", version = "=0.15.1", features = ["static", "zlib", "lzf"] }
blake3 = { version = "1", features = ["rayon"] }
rayon = "1"
rmp-serde = "1"
xraydb = { version = "=0.4.1", default-features = false }

# Retain runtime-dispatched ARM SHA instructions for existing project blob
# identities; live display buffers use an independent parallel fingerprint.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[[bin]]
name = "dioptas-processor"
path = "src/main.rs"

[workspace]


# Keep the real-image native algorithms practical in the development preview.
# This changes optimization only, not float arithmetic policy or CPU target.
[profile.dev.package.dioptrin]
opt-level = 2

[profile.dev.package.dioptas-backend]
opt-level = 2

[profile.dev.package.dioptrin-io]
opt-level = 2

# The codec is a separate C dependency: optimizing dioptrin-io alone leaves
# Bitshuffle/LZ4 (including its NEON/AVX2 kernels) at -O0 in live previews.
[profile.dev.package.hdf5-bitshuffle]
opt-level = 2

[profile.dev.package.phasesmith-core]
opt-level = 2

[profile.dev.package.phasesmith-crystallography]
opt-level = 2

[profile.dev.package.peritheos]
opt-level = 2

[profile.dev.package.sha2]
opt-level = 2

# Display buffer IDs are on every image-navigation path. Keep their library
# optimized in live previews, like the numerical kernels.
[profile.dev.package.blake3]
opt-level = 2

# Float-to-JSON formatting of full calibration contours is also a hot path.
[profile.dev.package.zmij]
opt-level = 2
